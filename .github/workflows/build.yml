name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1"
      - name: Install Gradle 8.4
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Sign APK
        run: |
          keytool -genkeypair -keystore release.keystore -alias nucleo -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass nucleo123 -keypass nucleo123 \
            -dname "CN=Nucleo, OU=Dev, O=Nucleo, L=SP, ST=SP, C=BR"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore --ks-key-alias nucleo \
            --ks-pass pass:nucleo123 --key-pass pass:nucleo123 \
            --out nucleo-ia.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nucleo-ia-apk
          path: nucleo-ia.apk
